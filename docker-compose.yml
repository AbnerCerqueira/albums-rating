services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PROFILE: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/albums-rating
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      PUBLIC_BASE_URL: http://localhost:3000
      UPLOAD_DIR: uploads
      LOG_LEVEL: info
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health-check"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  uploads-data:
